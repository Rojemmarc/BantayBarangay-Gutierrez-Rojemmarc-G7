<a class="c report-card st-card-{{ x.status|slugify }}{% if x.active %} em{% endif %}" href="{% url 'detail' x.pk %}">
  <div class="report-card-body">
    <div class="report-card-title">{% if x.is_emergency %}⚠ {% endif %}{{ x.title }}</div>
    <div class="report-card-meta">
      <span>{{ x.category.name }}</span>
      <span>· {{ x.who }}</span>
      <span>· {{ x.created_at|date:"M j, Y g:i A" }}</span>
      {% if x.department %}<span>· {{ x.department.name }}</span>{% endif %}
    </div>
  </div>
  <div class="report-card-side">
    {% include 'partials/badge.html' with status=x.status %}
    <span class="report-chevron" aria-hidden="true">›</span>
  </div>
</a>
